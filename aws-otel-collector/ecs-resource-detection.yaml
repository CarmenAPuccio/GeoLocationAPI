# ECS sidecar configuration. Traces go to X-Ray, metrics to CloudWatch (EMF) and logs to CloudWatch Logs.
extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  awsxray:
    endpoint: 0.0.0.0:2000
    transport: udp
  statsd:
    endpoint: 0.0.0.0:8125
    aggregation_interval: 60s

processors:
  batch/traces:
    timeout: 1s
    send_batch_size: 50
  batch/metrics:
    timeout: 60s
  batch/logs:
    timeout: 5s
  resource_detection/ecs:
    detectors: [env, ecs]
    timeout: 2s
    override: false

exporters:
  debug:
    verbosity: basic
  awsxray:
    # Annotations are indexed, so traces can be filtered by them in X-Ray: annotation.geolocation_found = true
    indexed_attributes: ["geolocation.found"]
  awsemf:
    # One metric per attribute combination, instead of the extra rolled-up copies the default creates.
    dimension_rollup_option: NoDimensionRollup
    namespace: ECS/AWSOTel/Application
    log_group_name: '/geolocationapi/otel/metrics'
  awscloudwatchlogs:
    log_group_name: '/geolocationapi/otel/logs'
    log_stream_name: geolocationapi

service:
  pipelines:
    traces:
      receivers: [otlp, awsxray]
      processors: [resource_detection/ecs, batch/traces]
      exporters: [awsxray]
    metrics:
      receivers: [otlp, statsd]
      processors: [resource_detection/ecs, batch/metrics]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [resource_detection/ecs, batch/logs]
      exporters: [awscloudwatchlogs]
  extensions: [health_check]
